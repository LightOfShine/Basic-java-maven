name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Build, Test, and SonarCloud Analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -B verify sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=lightofshine -Dsonar.projectKey=lightofshine_Basic-java-maven
      
    # TAHAP CONTINUOUS DELIVERY
    - name: Upload Artifact (Continuous Delivery)
      uses: actions/upload-artifact@v4
      with:
        name: java-maven-artifact
        path: target/*.jar

  # TAHAP CONTINUOUS DEPLOYMENT (Simulasi)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: java-maven-artifact
        
    - name: Simulate Deployment to Production
      run: |
        echo "========================================="
        echo "🚀 SIMULASI CONTINUOUS DEPLOYMENT 🚀"
        echo "========================================="
        echo "1. Menghubungkan ke server produksi..."
        sleep 2
        echo "2. Mengirim file .jar (Artifact) ke server..."
        ls -la
        sleep 2
        echo "3. Me-restart service aplikasi di production..."
        sleep 2
        echo "✅ BERHASIL! Aplikasi versi terbaru sudah online."
